<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kaggle Courses - Social Preview</title>
<!-- Renders the 1280x640 social preview from this repository's own assets. -->
</head>
<body>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:640px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
.card{position:relative;width:1280px;height:640px;overflow:hidden;background:#fff}
.card:before{content:"";position:absolute;right:-150px;top:-190px;width:640px;height:640px;
  background:#FFD43B;border-radius:46% 54% 42% 58% / 52% 44% 56% 48%}
.card:after{content:"";position:absolute;right:-90px;top:120px;width:420px;height:420px;
  background:#20BEFF;border-radius:52% 48% 58% 42% / 46% 56% 44% 54%;opacity:.92}
.blob3{position:absolute;right:60px;top:60px;width:250px;height:250px;background:#1FA34A;
  border-radius:50% 50% 44% 56% / 56% 44% 56% 44%;opacity:.9}
.fanwrap{position:absolute;right:56px;bottom:44px;width:660px;height:430px}
.cert{position:absolute;left:50%;top:50%;width:430px;margin-left:-215px;margin-top:-133px;
  border-radius:8px;box-shadow:0 16px 40px rgba(15,23,42,.26);border:1px solid #e6eaef}
.left{position:absolute;left:78px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center}
.k{font-size:13px;font-weight:800;letter-spacing:.20em;color:#20BEFF}
.h1{margin-top:14px;font-size:58px;font-weight:800;line-height:1.02;letter-spacing:-.025em;color:#111}
.rule{margin:24px 0 20px;width:84px;height:4px;background:#20BEFF}
.n{display:flex;align-items:baseline;gap:12px}
.n b{font-size:44px;font-weight:800;color:#111;letter-spacing:-.02em}
.n span{font-size:16px;color:#5b6672}
.list{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px;max-width:470px}
.list i{font-style:normal;font-size:12.5px;font-weight:600;color:#31404e;background:#f1f5f9;
  border:1px solid #e2e8f0;border-radius:999px;padding:5px 11px}
.by{margin-top:24px;font-size:16px;font-weight:700;color:#111}
.by span{display:block;font-size:12px;font-weight:700;letter-spacing:.18em;color:#8b95a1;margin-bottom:6px}
</style>
<div class="card">
  <div class="blob3"></div>
  <div class="fanwrap"><img class="cert" style="transform:rotate(-10.8deg) translate(-78px,27px);z-index:0" src="Source%20Code/Machine%20Learning%20-%20Intro%20and%20Intermediate/Intro%20to%20Machine%20Learning/Kaggle%20Intro%20to%20Machine%20Learning.png"><img class="cert" style="transform:rotate(-7.2deg) translate(-52px,18px);z-index:1" src="Source%20Code/Data%20Manipulation/Pandas/Kaggle%20Pandas.png"><img class="cert" style="transform:rotate(-3.6deg) translate(-26px,9px);z-index:2" src="Source%20Code/Data%20Visualization/Kaggle%20Data%20Visualization.png"><img class="cert" style="transform:rotate(0deg) translate(0px,0px);z-index:3" src="Source%20Code/Machine%20Learning%20-%20Intro%20and%20Intermediate/Intermediate%20Machine%20Learning/Kaggle%20Intermediate%20Machine%20Learning.png"><img class="cert" style="transform:rotate(3.6deg) translate(26px,9px);z-index:4" src="Source%20Code/Data%20Cleaning/Kaggle%20Data%20Cleaning.png"><img class="cert" style="transform:rotate(7.2deg) translate(52px,18px);z-index:5" src="Source%20Code/Feature%20Engineering/Kaggle%20Feature%20Engineering.png"><img class="cert" style="transform:rotate(10.8deg) translate(78px,27px);z-index:6" src="Source%20Code/Machine%20Learning%20Explainability/Kaggle%20Machine%20Learning%20Explainability.png"></div>
  <div class="left">
    <div class="k">KAGGLE LEARN</div>
    <div class="h1">Kaggle Courses</div>
    <div class="rule"></div>
    <div class="n"><b>7</b><span>certificates of completion</span></div>
    <div class="list"><i>Intro to Machine Learning</i><i>Pandas</i><i>Data Visualization</i><i>Intermediate Machine Learning</i><i>Data Cleaning</i><i>Feature Engineering</i><i>Machine Learning Explainability</i></div>
    <div class="by"><span>COMPLETED BY</span>Amey Thakur</div>
  </div>
</div>
</body>
</html>
